    /* ===== ARCHIVE PAGE ===== */
    .archive-page {
      flex: 1;
      padding: 40px var(--margin-x) 80px;
      max-width: var(--max-w);
      margin: 0 auto;
      width: 100%;
    }

    .archive-header {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 20px;
    }

    .archive-title {
      font-size: var(--md-sys-typescale-headline-small-size);
      font-weight: 500;
      letter-spacing: -0.3px;
      color: var(--ink);
    }

    .archive-count {
      font-size: var(--md-sys-typescale-body-medium-size);
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    /* ===== FILTER CHIPS ===== */
    .chip-row {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 16px;
      border-radius: var(--md-sys-shape-corner-full);
      border: 1px solid var(--sep);
      background: transparent;
      color: var(--ink);
      font-family: var(--font);
      font-size: var(--md-sys-typescale-label-medium-size);
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition:
        background var(--md-sys-motion-duration-short3) var(--md-sys-motion-easing-standard),
        border-color var(--md-sys-motion-duration-short3) var(--md-sys-motion-easing-standard),
        color var(--md-sys-motion-duration-short3) var(--md-sys-motion-easing-standard);
    }

    .chip::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--md-sys-color-on-surface);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--md-sys-motion-duration-short3) var(--md-sys-motion-easing-standard);
    }
    .chip:hover::before  { opacity: 0.08; }
    .chip:active::before { opacity: 0.12; }

    .chip.active {
      background: var(--md-sys-color-primary-container);
      border-color: transparent;
      color: var(--md-sys-color-on-primary-container);
    }

    .chip-check {
      display: none;
      flex-shrink: 0;
    }
    .chip.active .chip-check { display: block; }

    /* ===== TOOLBAR (chips + sort) ===== */
    .archive-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
    }

    .archive-toolbar .chip-row {
      margin-bottom: 0;
      flex: 1;
      min-width: 0;
    }

    .sort-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .sort-select {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: none;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-3);
      cursor: pointer;
      padding: 4px 18px 4px 0;
      outline: none;
      transition: color var(--md-sys-motion-duration-short3) var(--md-sys-motion-easing-standard);
    }

    .sort-select:hover { color: var(--ink); }

    .sort-wrap::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 6px;
      background: currentColor;
      color: var(--ink-3);
      pointer-events: none;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    /* ===== GRID ===== */
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 40px 24px;
    }

    .archive-item {
      cursor: pointer;
    }

    .archive-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: opacity 200ms var(--md-sys-motion-easing-standard);
    }

    .archive-item:hover img {
      opacity: 0.88;
    }

    .archive-caption {
      margin-top: 12px;
    }

    .archive-caption-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.4;
    }

    .archive-caption-meta {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 2px;
    }

    @media (max-width: 900px) {
      .archive-grid { grid-template-columns: repeat(4, 1fr); gap: 32px 20px; }
    }

    @media (max-width: 600px) {
      .archive-page { padding: 24px 16px 60px; }
      .archive-grid { grid-template-columns: repeat(3, 1fr); gap: 28px 12px; }
    }
  </style>

let activeFilter = 'all';
let activeSort = 'newest';

function sortedWorks(works) {
  return [...works].sort((a, b) => {
    const ya = parseInt(a.year) || (activeSort === 'newest' ? 0 : 9999);
    const yb = parseInt(b.year) || (activeSort === 'newest' ? 0 : 9999);
    return activeSort === 'newest' ? yb - ya : ya - yb;
  });
}

function renderArchive() {
  const grid = document.getElementById('archive-grid');
  const countEl = document.getElementById('archive-count');
  const filtered = activeFilter === 'all' ? ALL_WORKS : ALL_WORKS.filter(w => w.cat === activeFilter);
  const works = sortedWorks(filtered);

  grid.innerHTML = '';

  works.forEach((art, i) => {
    const item = document.createElement('div');
    item.className = 'archive-item';
    const yearStr = art.year ? `, ${art.year}` : '';
    const metaParts = [art.medium, art.dims].filter(Boolean).join(' · ');
    item.innerHTML = `
      <img src="${art.src}" alt="${art.title}${yearStr}" loading="lazy">
      <div class="archive-caption">
        <div class="archive-caption-title">${art.title}${yearStr}</div>
        ${metaParts ? `<div class="archive-caption-meta">${metaParts}</div>` : ''}
      </div>`;
    item.addEventListener('click', () => {
      openDetailPanel(works, i, item.querySelector('img'));
    });
    grid.appendChild(item);
  });

  const n = works.length;
  countEl.textContent = `${n} work${n !== 1 ? 's' : ''}`;
}

document.addEventListener('DOMContentLoaded', () => {
  renderArchive();

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const filter = chip.dataset.filter;
      if (filter === activeFilter) return;
      activeFilter = filter;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      renderArchive();
    });
  });

  document.getElementById('sort-select').addEventListener('change', e => {
    activeSort = e.target.value;
    renderArchive();
  });
});
</script>
